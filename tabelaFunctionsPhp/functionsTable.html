<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca PHP - Busca Inteligente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .function-link {
            color: #0d6efd;
            text-decoration: underline;
            cursor: pointer;
        }

        .function-link:hover {
            color: #0a58ca;
        }

        .search-score {
            font-size: 0.8em;
            color: #6c757d;
            margin-left: 5px;
        }

        .highlight {
            background-color: yellow;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="container mt-4">
        <h1 class="text-center mb-4">Biblioteca de Funções PHP</h1>

        <!-- Campo de busca -->
        <div class="mb-4">
            <input type="text" class="form-control" id="searchInput"
                placeholder="Pesquisar funções (ex: 'função para calcular raiz quadrada')">
        </div>

        <!-- Botões de exportar e importar -->
        <div class="mb-3">
            <button class="btn btn-primary me-2" onclick="exportData()">Exportar JSON</button>
            <input type="file" id="importFile" accept=".json" style="display: none;" onchange="importData(event)">
            <button class="btn btn-secondary" onclick="document.getElementById('importFile').click()">Importar
                JSON</button>
        </div>

        <!-- Botão para abrir formulário -->
        <button class="btn btn-success mb-3" data-bs-toggle="modal" data-bs-target="#addFunctionModal">Adicionar Nova
            Função</button>

        <!-- Tabela -->
        <div class="table-responsive">
            <table class="table table-striped table-bordered">
                <thead>
                    <tr>
                        <th>Função PHP</th>
                        <th>Serve para...</th>
                    </tr>
                </thead>
                <tbody id="functionTableBody"></tbody>
            </table>
        </div>
    </div>

    <!-- Modal para adicionar função -->
    <div class="modal fade" id="addFunctionModal" tabindex="-1" aria-labelledby="addFunctionModalLabel"
        aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="addFunctionModalLabel">Adicionar Nova Função</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="addFunctionForm">
                        <div class="mb-3">
                            <label for="functionName" class="form-label">Nome da Função</label>
                            <input type="text" class="form-control" id="functionName" required>
                        </div>
                        <div class="mb-3">
                            <label for="functionDescription" class="form-label">Descrição (Serve para...)</label>
                            <input type="text" class="form-control" id="functionDescription" required>
                        </div>
                        <div class="mb-3">
                            <label for="functionSyntax" class="form-label">Sintaxe</label>
                            <textarea class="form-control" id="functionSyntax" rows="4" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="functionUsage" class="form-label">Instruções de Uso</label>
                            <textarea class="form-control" id="functionUsage" rows="4" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">Salvar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para exibir detalhes -->
    <div class="modal fade" id="functionDetailModal" tabindex="-1" aria-labelledby="functionDetailModalLabel"
        aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="functionDetailModalLabel"></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <h6>Sintaxe:</h6>
                    <pre id="modalSyntax"></pre>
                    <h6>Instruções de Uso:</h6>
                    <p id="modalUsage"></p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Função para normalizar texto (remover acentos e ignorar maiúsculas/minúsculas)
        function normalizeText(text) {
            return text
                .toLowerCase()
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '');
        }

        // Dicionário de sinônimos e palavras relacionadas
        const synonyms = {
            'calcular': ['computar', 'efetuar', 'obter', 'fazer', 'realizar', 'executar'],
            'determinar': ['identificar', 'descobrir', 'verificar', 'checar', 'detectar', 'saber'],
            'tipo': ['tipo de dado', 'categoria', 'classe', 'especie', 'natureza'],
            'dado': ['dados', 'informacao', 'valor', 'variavel', 'conteudo'],
            'string': ['texto', 'cadeia', 'palavra', 'frase', 'caractere'],
            'numero': ['numerico', 'valor', 'digito', 'inteiro', 'decimal'],
            'array': ['matriz', 'lista', 'vetor', 'conjunto'],
            'tamanho': ['comprimento', 'extensao', 'dimensao', 'size', 'length'],
            'converter': ['transformar', 'mudar', 'alterar', 'modificar', 'trocar'],
            'ordenar': ['classificar', 'organizar', 'arranjar', 'sort'],
            'buscar': ['procurar', 'encontrar', 'localizar', 'search'],
            'contar': ['count', 'enumerar', 'somar', 'totalizar'],
            'raiz': ['raiz quadrada', 'square root', 'sqrt'],
            'quadrada': ['quadrado', 'square'],
            'arredondar': ['round', 'aproximar', 'truncar'],
            'maximo': ['max', 'maior', 'superior'],
            'minimo': ['min', 'menor', 'inferior'],
            'dividir': ['divisao', 'split', 'separar'],
            'juntar': ['unir', 'concatenar', 'merge', 'join'],
            'substituir': ['replace', 'trocar', 'mudar', 'alterar'],
            'remover': ['remove', 'deletar', 'tirar', 'excluir'],
            'adicionar': ['add', 'inserir', 'incluir', 'acrescentar'],
            'validar': ['verificar', 'checar', 'confirmar', 'testar'],
            'formatar': ['format', 'estruturar', 'organizar'],
            'extrair': ['extract', 'pegar', 'obter', 'retirar'],
            'codificar': ['encode', 'criptografar', 'converter'],
            'decodificar': ['decode', 'descriptografar', 'reverter']
        };

        // Expandir sinônimos bidirecionalmente
        function expandSynonyms() {
            const expanded = { ...synonyms };
            for (const [word, syns] of Object.entries(synonyms)) {
                syns.forEach(syn => {
                    if (!expanded[syn]) {
                        expanded[syn] = [word, ...syns.filter(s => s !== syn)];
                    } else {
                        expanded[syn] = [...new Set([...expanded[syn], word, ...syns])];
                    }
                });
            }
            return expanded;
        }

        const expandedSynonyms = expandSynonyms();

        // Função para calcular distância de Levenshtein
        function levenshteinDistance(str1, str2) {
            const matrix = [];
            for (let i = 0; i <= str2.length; i++) {
                matrix[i] = [i];
            }
            for (let j = 0; j <= str1.length; j++) {
                matrix[0][j] = j;
            }
            for (let i = 1; i <= str2.length; i++) {
                for (let j = 1; j <= str1.length; j++) {
                    if (str2.charAt(i - 1) === str1.charAt(j - 1)) {
                        matrix[i][j] = matrix[i - 1][j - 1];
                    } else {
                        matrix[i][j] = Math.min(
                            matrix[i - 1][j - 1] + 1,
                            matrix[i][j - 1] + 1,
                            matrix[i - 1][j] + 1
                        );
                    }
                }
            }
            return matrix[str2.length][str1.length];
        }

        // Função para calcular similaridade fuzzy
        function fuzzyMatch(term, text, threshold = 0.7) {
            const distance = levenshteinDistance(term, text);
            const maxLength = Math.max(term.length, text.length);
            const similarity = 1 - (distance / maxLength);
            return similarity >= threshold ? similarity : 0;
        }

        // Função para expandir termos de busca com sinônimos
        function expandSearchTerms(terms) {
            const expanded = new Set(terms);
            terms.forEach(term => {
                if (expandedSynonyms[term]) {
                    expandedSynonyms[term].forEach(synonym => expanded.add(synonym));
                }
            });
            return Array.from(expanded);
        }

        // Função para calcular score de relevância
        function calculateRelevanceScore(func, searchTerms, originalTerms) {
            const normalizedName = normalizeText(func.name);
            const normalizedDesc = normalizeText(func.description);
            const normalizedSyntax = normalizeText(func.syntax || '');
            const normalizedUsage = normalizeText(func.usage || '');

            let score = 0;
            const foundTerms = new Set();

            // Busca exata nos termos originais (peso maior)
            originalTerms.forEach(term => {
                if (normalizedName.includes(term)) {
                    score += 10;
                    foundTerms.add(term);
                }
                if (normalizedDesc.includes(term)) {
                    score += 8;
                    foundTerms.add(term);
                }
                if (normalizedSyntax.includes(term)) {
                    score += 5;
                    foundTerms.add(term);
                }
                if (normalizedUsage.includes(term)) {
                    score += 3;
                    foundTerms.add(term);
                }
            });

            // Busca com sinônimos (peso médio)
            searchTerms.forEach(term => {
                if (!originalTerms.includes(term)) { // Evitar dupla contagem
                    if (normalizedName.includes(term)) {
                        score += 6;
                        foundTerms.add(term);
                    }
                    if (normalizedDesc.includes(term)) {
                        score += 5;
                        foundTerms.add(term);
                    }
                    if (normalizedSyntax.includes(term)) {
                        score += 3;
                        foundTerms.add(term);
                    }
                    if (normalizedUsage.includes(term)) {
                        score += 2;
                        foundTerms.add(term);
                    }
                }
            });

            // Busca fuzzy (peso menor)
            searchTerms.forEach(term => {
                if (term.length >= 4) { // Só aplica fuzzy em palavras com 4+ caracteres
                    const words = [
                        ...normalizedName.split(/\s+/),
                        ...normalizedDesc.split(/\s+/),
                        ...normalizedSyntax.split(/\s+/),
                        ...normalizedUsage.split(/\s+/)
                    ];

                    words.forEach(word => {
                        if (word.length >= 4) {
                            const similarity = fuzzyMatch(term, word, 0.7);
                            if (similarity > 0) {
                                score += similarity * 2;
                                foundTerms.add(term);
                            }
                        }
                    });
                }
            });

            // Bonus por número de termos encontrados
            const termCoverage = foundTerms.size / originalTerms.length;
            score += termCoverage * 5;

            // Bonus por proximidade de palavras (busca por frases)
            if (originalTerms.length > 1) {
                const fullQuery = originalTerms.join(' ');
                if (normalizedDesc.includes(fullQuery)) {
                    score += 15; // Bonus alto para frase completa
                } else {
                    // Verifica proximidade de palavras
                    let proximityBonus = 0;
                    for (let i = 0; i < originalTerms.length - 1; i++) {
                        const term1 = originalTerms[i];
                        const term2 = originalTerms[i + 1];
                        const regex = new RegExp(`${term1}.{0,10}${term2}|${term2}.{0,10}${term1}`, 'i');
                        if (regex.test(normalizedDesc)) {
                            proximityBonus += 3;
                        }
                    }
                    score += proximityBonus;
                }
            }

            return score;
        }

        // Função para destacar termos encontrados
        function highlightTerms(text, terms) {
            let highlighted = text;
            terms.forEach(term => {
                const regex = new RegExp(`(${term})`, 'gi');
                highlighted = highlighted.replace(regex, '<span class="highlight">$1</span>');
            });
            return highlighted;
        }

        // Inicializar IndexedDB
        let db;
        const request = indexedDB.open('PHPLibrary', 1);

        request.onupgradeneeded = function (event) {
            db = event.target.result;
            const store = db.createObjectStore('functions', { keyPath: 'id', autoIncrement: true });
            store.createIndex('name', 'name', { unique: false });
            store.createIndex('description', 'description', { unique: false });
        };

        request.onsuccess = function (event) {
            db = event.target.result;
            loadFunctions();
        };

        request.onerror = function (event) {
            console.error('Erro ao abrir o IndexedDB:', event);
        };

        // Carregar funções do IndexedDB
        function loadFunctions() {
            const transaction = db.transaction(['functions'], 'readonly');
            const store = transaction.objectStore('functions');
            const request = store.getAll();

            request.onsuccess = function (event) {
                const functions = event.target.result;
                if (functions.length === 0) {
                    // Adicionar funções iniciais
                    addInitialFunctions();
                } else {
                    renderTable(functions);
                }
            };
        }

        // Adicionar funções iniciais
        function addInitialFunctions() {
            const initialFunctions = [
                {
                    name: 'sqrt()',
                    description: 'Função para efetuar o cálculo da raiz quadrada',
                    syntax: 'float sqrt(float $number)',
                    usage: 'Retorna a raiz quadrada de $number. Exemplo: $result = sqrt(16); // Retorna 4'
                },
                {
                    name: 'gettype()',
                    description: 'Função para determinar o tipo de uma variável',
                    syntax: 'string gettype(mixed $var)',
                    usage: 'Retorna o tipo da variável. Exemplo: $type = gettype(42); // Retorna "integer"'
                },
                {
                    name: 'strlen()',
                    description: 'Função para obter o comprimento de uma string',
                    syntax: 'int strlen(string $string)',
                    usage: 'Retorna o número de caracteres da string. Exemplo: $length = strlen("Hello"); // Retorna 5'
                },
                {
                    name: 'array_sort()',
                    description: 'Função para ordenar um array',
                    syntax: 'bool sort(array &$array, int $flags = SORT_REGULAR)',
                    usage: 'Ordena um array. Exemplo: sort($array); // Ordena o array em ordem crescente'
                }
            ];

            const transaction = db.transaction(['functions'], 'readwrite');
            const store = transaction.objectStore('functions');

            initialFunctions.forEach(func => {
                store.add(func);
            });

            transaction.oncomplete = function () {
                loadFunctions();
            };
        }

        // Renderizar tabela
        function renderTable(functions, searchTerms = []) {
            const tableBody = document.getElementById('functionTableBody');
            tableBody.innerHTML = '';
            functions.forEach(func => {
                const description = searchTerms.length > 0 ?
                    highlightTerms(func.description, searchTerms) :
                    func.description;

                const row = document.createElement('tr');
                row.innerHTML = `
                <td>${func.name}${func.score ? `<span class="search-score">(${func.score.toFixed(1)})</span>` : ''}</td>
                <td><a class="function-link" onclick="showFunctionDetails(${func.id})">${description}</a></td>
            `;
                tableBody.appendChild(row);
            });
        }

        // Exibir detalhes da função no modal
        function showFunctionDetails(id) {
            const transaction = db.transaction(['functions'], 'readonly');
            const store = transaction.objectStore('functions');
            const request = store.get(id);

            request.onsuccess = function (event) {
                const func = event.target.result;
                document.getElementById('functionDetailModalLabel').textContent = func.name;
                document.getElementById('modalSyntax').textContent = func.syntax;
                document.getElementById('modalUsage').textContent = func.usage;
                new bootstrap.Modal(document.getElementById('functionDetailModal')).show();
            };
        }

        // Adicionar nova função
        document.getElementById('addFunctionForm').addEventListener('submit', function (event) {
            event.preventDefault();
            const newFunction = {
                name: document.getElementById('functionName').value,
                description: document.getElementById('functionDescription').value,
                syntax: document.getElementById('functionSyntax').value,
                usage: document.getElementById('functionUsage').value
            };

            const transaction = db.transaction(['functions'], 'readwrite');
            const store = transaction.objectStore('functions');
            store.add(newFunction);

            transaction.oncomplete = function () {
                document.getElementById('addFunctionForm').reset();
                bootstrap.Modal.getInstance(document.getElementById('addFunctionModal')).hide();
                loadFunctions();
            };
        });

        // Filtro de busca inteligente
        document.getElementById('searchInput').addEventListener('input', function () {
            const originalTerms = normalizeText(this.value).split(' ').filter(term => term.length > 0);

            if (originalTerms.length === 0) {
                loadFunctions();
                return;
            }

            // Expandir termos com sinônimos
            const expandedTerms = expandSearchTerms(originalTerms);

            const transaction = db.transaction(['functions'], 'readonly');
            const store = transaction.objectStore('functions');
            const request = store.getAll();

            request.onsuccess = function (event) {
                const functions = event.target.result;

                // Calcular score de relevância para cada função
                const scoredFunctions = functions.map(func => {
                    const score = calculateRelevanceScore(func, expandedTerms, originalTerms);
                    return { ...func, score };
                });

                // Filtrar funções com score > 0 e ordenar por relevância
                const filtered = scoredFunctions
                    .filter(func => func.score > 0)
                    .sort((a, b) => b.score - a.score);

                renderTable(filtered, originalTerms);
            };
        });

        // Exportar dados como JSON
        function exportData() {
            const transaction = db.transaction(['functions'], 'readonly');
            const store = transaction.objectStore('functions');
            const request = store.getAll();

            request.onsuccess = function (event) {
                const data = event.target.result;
                const json = JSON.stringify(data, null, 2);
                const blob = new Blob([json], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'php_functions.json';
                a.click();
                URL.revokeObjectURL(url);
            };
        }

        // Importar dados JSON
        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function (e) {
                try {
                    const data = JSON.parse(e.target.result);
                    const transaction = db.transaction(['functions'], 'readwrite');
                    const store = transaction.objectStore('functions');
                    store.clear(); // Limpar dados existentes
                    data.forEach(item => {
                        // Remove score se existir (não deve ser persistido)
                        const { score, ...cleanItem } = item;
                        store.add(cleanItem);
                    });
                    transaction.oncomplete = function () {
                        loadFunctions();
                        alert('Dados importados com sucesso!');
                    };
                } catch (error) {
                    alert('Erro ao importar dados: ' + error.message);
                }
            };
            reader.readAsText(file);
        }
    </script>
</body>

</html>
